services:
  db:
    image: postgres:latest
    container_name: LibraDraconisDB
    restart: always
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: LibraDraconis
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5


  pgweb:
    image: sosedoff/pgweb
    container_name: LibraDraconisDB-pgweb
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:password@db:5432/LibraDraconis?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
